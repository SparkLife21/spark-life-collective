# GitHub → IONOS regular web hosting.
# Builds the static export and uploads it over SFTP to the folder the domain serves.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   IONOS_SFTP_HOST      from IONOS SFTP details (often access….webspace-data.io)
#   IONOS_SFTP_USER      SFTP username for the /collective account
#   IONOS_SFTP_PASSWORD  that password
# Optional variables:
#   NEXT_PUBLIC_SITE_URL     live https:// domain. Falls back to the SITE_URL
#                            default below; set the variable to publish elsewhere.
#   IONOS_SFTP_REMOTE_DIR    normally unset — the SFTP account already lands in
#                            the folder the domain serves. Set a folder name to
#                            publish into a subfolder instead.

name: Deploy to IONOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/ionos-static-hosting-4b98

concurrency:
  group: ionos-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Repository variable NEXT_PUBLIC_SITE_URL wins when it is set.
  SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.sparklifecollective.org' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check IONOS SFTP secrets
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          PASS: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          missing=0
          [ -n "$HOST" ] || { echo "Missing secret IONOS_SFTP_HOST"; missing=1; }
          [ -n "$USER" ] || { echo "Missing secret IONOS_SFTP_USER"; missing=1; }
          [ -n "$PASS" ] || { echo "Missing secret IONOS_SFTP_PASSWORD"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Add the IONOS SFTP host, user, and password as GitHub Actions secrets:"
            echo "https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            exit 1
          fi

      - run: npm ci

      - name: Report the public site URL
        env:
          SITE_URL_VAR: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          if [ -n "$SITE_URL_VAR" ]; then
            echo "Building for $SITE_URL (repository variable NEXT_PUBLIC_SITE_URL)."
          else
            echo "Building for $SITE_URL (workflow default)."
            echo "Set repository variable NEXT_PUBLIC_SITE_URL to publish a different domain."
          fi

      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}

      - name: Confirm export
        run: |
          test -f out/index.html
          test -f out/.htaccess

      - name: Stamp the build so the live site can be verified
        run: echo "$GITHUB_SHA" > out/deploy-id.txt

      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload out/ to IONOS
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          IONOS_SFTP_REMOTE_DIR: ${{ vars.IONOS_SFTP_REMOTE_DIR }}
        run: bash scripts/deploy-ionos.sh

      - name: Confirm the live site serves this build
        run: |
          url="${SITE_URL%/}/deploy-id.txt"
          for attempt in 1 2 3 4 5; do
            live="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$url?cb=$attempt" || true)"
            if [ "$(echo "$live" | tr -d '[:space:]')" = "$GITHUB_SHA" ]; then
              echo "$SITE_URL is serving $GITHUB_SHA."
              exit 0
            fi
            echo "Attempt $attempt: $url returned '${live:-nothing}', expected $GITHUB_SHA."
            sleep 10
          done
          echo "The upload finished but $SITE_URL is not serving this commit."
          echo "Check which folder the IONOS domain is pointed at, then compare it to the SFTP home printed above."
          exit 1
